<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>朝霞晚霞预测</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
         background: linear-gradient(135deg,#fdf2f8,#fff7ed,#ede9fe); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .box { background: #fff; border-radius: 24px; box-shadow: 0 20px 60px rgba(0,0,0,.12); padding: 40px 36px; max-width: 440px; width: 100%; text-align: center; }
  h1 { margin: 0; font-size: 24px; color: #1e293b; }
  .sub { margin: 8px 0 28px; font-size: 14px; color: #64748b; }
  a.card { display: block; text-decoration: none; color: #fff; border-radius: 16px; padding: 18px 16px; margin: 12px 0; font-size: 17px; font-weight: 700; transition: transform .12s; }
  a.card:hover { transform: translateY(-2px); }
  a.card .d { display: block; font-size: 12px; font-weight: 400; opacity: .9; margin-top: 4px; }
  a.report { background: linear-gradient(135deg,#fb7185,#f97316); }
  a.map { background: linear-gradient(135deg,#8b5cf6,#6366f1); }
  .foot { margin-top: 24px; font-size: 12px; color: #94a3b8; }
</style>
</head>
<body>
  <div class="box">
    <h1>朝霞 · 晚霞预测</h1>
    <div class="sub">火烧云概率预报 · 仅供摄影参考</div>
    <a class="card report" href="report.html">
      🌇 单城预测报告
      <span class="d">未来 7 天朝霞/晚霞评分 + 每日天气</span>
    </a>
    <a class="card map" href="national_map.html">
      🗺️ 全国预测地图
      <span class="d">全国城市出霞评分热力分布</span>
    </a>
    <div class="foot">数据源 Open-Meteo · 每天自动更新</div>
  </div>
</body>
</html>
