# 朝霞晚霞预测 —— 配置文件
# 修改后下次运行自动生效
#
# ============ 各 Key/Token 获取地址速查 ============
# 1. 腾讯地图 key（全国地图用）  → https://lbs.qq.com  （腾讯位置服务：注册实名 → 应用管理 → 创建应用 → 添加 key）
# 2. Server酱 SendKey（微信推送）→ https://sct.ftqq.com （微信扫码登录 → SendKey 页面复制 SCT 开头密钥）
# 3. 星图云 token（官方火烧云对比）→ https://open.geovisearth.com （可选，需申请）
# ==================================================

city:
  name: "西安"
  latitude: 34.34
  longitude: 108.94
  timezone: "Asia/Shanghai"

forecast:
  days: 7            # 预测未来几天的朝霞晚霞

# 太阳方位剖面（方向性评分）
# 朝霞/晚霞是有方向性的光学现象：光来自太阳所在方位，承光"幕布"却在几十到
# 几百公里之外，而且最壮观的形态来自"云层边缘效应"。本开关打开后，程序会沿
# 日出/日落方位角拉一条 0~500km 的剖面（早、晚两条射线合并为一次多坐标请求，
# 仍然免费无 Key），据此计算「剖面云边界」「太阳方位遮挡」两个因子。
# 关闭或取数失败时对应因子整体移出加权，不影响其余因子评分。
transect:
  enabled: true        # 单城报告是否启用（true / false）
  national_map: true   # 全国地图是否同样启用（每城多 1 次请求，被限流可关）

# 地形遮蔽（PVGIS 90m 数字高程的地平线剖面，免费、无需注册）
# 山区城市太阳方位上的地平线会被山体抬高，可见的低空天空被切掉一块。
# 地平线是静态地形量，每座城市只算一次并缓存到 cache_dir，之后永久复用。
horizon:
  enabled: true
  cache_dir: "data/horizon"

model:
  type: "logistic"   # 模型类型: logistic(逻辑回归) / rf(随机森林)
  bootstrap: true    # 是否把弱监督样本也纳入训练集（仅在有真实标签时生效）
  min_samples: 30    # 训练样本总数少于该数时退回纯规则评分模式
  # 真实观测标注数量门槛（关键）：低于该值时一律不训练、不启用模型。
  # 原因：弱监督标签是由规则分 rule_score 生成的确定性函数，用它训练出的
  # 指标（AUC 接近 1.0）衡量的是"能否复刻规则引擎"，对真实预测没有证据力。
  # 请在 data/raw/posts.csv 补充真实观测（date,window,glow,source,note）。
  min_real_labels: 30
  holdout_ratio: 0.3 # 时序留出比例，留出集只取真实观测样本
  model_path: "data/model/glow_model.joblib"

data:
  posts_csv: "data/raw/posts.csv"   # 帖子观测标注数据(可手动补充)
  # 训练时回溯的历史天数。历史数据走 Open-Meteo 的 Historical Forecast API
  # （历史预报归档，2021 年起），字段与推理侧的预报逐字段一致，避免 train-serve
  # skew；同时其回测指标不会像 ERA5 再分析那样因"事后最优"而系统性乐观。
  history_days: 120

# 第三方数值对比源（可选）
# 星图云(GeoVisEarth)开放平台提供官方「火烧云点查询预报API」，返回指定经纬度
# 未来3天日出/日落时刻的火烧云质量与等级，是最直接的可对比数据源。
# 需在 https://open.geovisearth.com 注册并申请 token（付费/配额）。
# 接口文档：https://open.geovisearth.com/support/document?docId=495
third_party:
  geovisearth:
    enabled: false   # 填入 token 并改为 true 后，交叉验证会自动加入第 4 方对比
    token: ""        # 星图云控制台申请的火烧云预报 API token
    base_url: "https://api.open.geovisearth.com/v2/grid/glow/day"
    mete_codes: "glow,aod"   # glow=火烧云质量, aod=蓝天指数（要素代码，逗号分隔）
    level: true              # 是否同时返回数据等级

output:
  dir: "output"
  report: "output/report.html"

# 腾讯地图（全国地图用）
# key 获取地址：https://lbs.qq.com（腾讯位置服务）
#   步骤：注册并实名/开发者认证 → 控制台「应用管理」→ 创建应用 →
#         添加 key（勾选「WebServiceAPI / 地图 JavaScript API」）→ 复制 key 填到下面。
#   重要：申请后需在 key 设置里把「服务器域名/IP」加入「域名白名单」，否则地图会被拒。
#
# ⚠️ 真实 key 请填写在 config.local.yaml（已被 .gitignore 排除），不要写在这里 ——
#    本文件会随仓库公开。这里留空即默认走本地代理模式（前端不携带 key）。
map:
  tmap_key: ""

# 本地 MySQL 存储（预测历史 / 城市 / 训练标注）
# 未启动 MySQL 时，程序会自动回退到文件存储，不影响预测。
database:
  enabled: true
  host: "127.0.0.1"
  port: 3306
  user: "root"
  password: ""       # initialize-insecure 生成的 root 无密码；正式使用请改
  database: "zhaoxia"

# 微信推送（Server酱）—— 融合 sunsetbot / ohyep-sunsetglow 的推送能力
# 未配置 sckey 或 enabled=false 时静默跳过，不影响预测。
notify:
  enabled: false
  sckey: ""          # Server酱 SendKey，在 https://sct.ftqq.com 登录后获取
  threshold: 70      # 预测分达到该值（对应"大烧"）才推送
  # 可选：朝霞/晚霞分别设阈值（留空则统一用上面的 threshold）。
  # 实际推送阈值还会结合多模型一致性 ±5 分动态微调（结论一致→更宽松，分歧大→更严格）。
  morning_threshold: null
  evening_threshold: null
